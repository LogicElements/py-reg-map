[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-reg-map"
version = "0.1.1"
description = "Register map generator for embedded firmware (C storage, LeBin and Modbus RTU JSON)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logic Elements s.r.o" }]
requires-python = ">=3.12"
keywords = ["register map", "firmware", "embedded", "modbus", "code generator", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["pyyaml>=6", "pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/LogicElements/py-reg-map"
Documentation = "https://github.com/LogicElements/py-reg-map/blob/main/doc/index.md"
Issues = "https://github.com/LogicElements/py-reg-map/issues"

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "openpyxl>=3.1"]

[project.scripts]
regmap = "regmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regmap"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["example", "doc"]  # VBA reference outputs are kept byte-for-byte; docs are prose

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline YAML test data reads better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
